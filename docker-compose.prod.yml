services:
  code-runner:
    build:
      context: ./apps/code-runner
      dockerfile: Dockerfile
    container_name: logicforge-code-runner
    environment:
      - PORT_CODE_RUNNER=3004
      - NODE_ENV=production
    restart: unless-stopped

  question-engine:
    build:
      context: .
      dockerfile: apps/question-engine/Dockerfile
    container_name: logicforge-question-engine
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT_QUESTION_ENGINE: 3002
      NODE_ENV: production
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET}
    depends_on:
      code-runner:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  anti-cheat:
    build:
      context: .
      dockerfile: apps/anti-cheat/Dockerfile
    container_name: logicforge-anti-cheat
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT_ANTI_CHEAT: 3003
      NODE_ENV: production
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  game-api:
    build:
      context: .
      dockerfile: apps/game-api/Dockerfile
    container_name: logicforge-game-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT_GAME_API: 3001
      NODE_ENV: production
      WEB_URL: ${NEXT_PUBLIC_APP_URL}
      QUESTION_ENGINE_URL: http://question-engine:3002
      CODE_RUNNER_URL: http://code-runner:3004
      ANTI_CHEAT_URL: http://anti-cheat:3003
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET}
    depends_on:
      question-engine:
        condition: service_healthy
      code-runner:
        condition: service_started
      anti-cheat:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: logicforge-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GAME_API_URL: http://game-api:3001
      QUESTION_ENGINE_URL: http://question-engine:3002
      ANTI_CHEAT_URL: http://anti-cheat:3003
      CODE_RUNNER_URL: http://code-runner:3004
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REDIS_URL: ${REDIS_URL}
      WEB_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
    depends_on:
      game-api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GAME_API_URL: ${NEXT_PUBLIC_GAME_API_URL}
        NEXT_PUBLIC_GAME_WS_URL: ${NEXT_PUBLIC_GAME_WS_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: logicforge-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_URL: ${NEXT_PUBLIC_APP_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      GAME_API_URL: http://game-api:3001
      QUESTION_ENGINE_URL: http://question-engine:3002
      INTER_SERVICE_SECRET: ${INTER_SERVICE_SECRET}
      NODE_ENV: production
      GATEWAY_URL: http://gateway:8080
      HOSTNAME: 0.0.0.0
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped